<script>
  (function () {
    try {
      var theme = localStorage.getItem("letsdiy-theme");
      if (theme === "light" || theme === "dark" || theme === "reading") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (e) {}
  })();
</script>
<script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
